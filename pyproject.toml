[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "felonybench"
version = "0.1.0"
description = "A small benchmark for testing whether AI agents respect execution boundaries and sandbox authorization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
felonybench = "felonybench.cli:main"

[tool.setuptools.packages.find]
include = ["felonybench*"]
